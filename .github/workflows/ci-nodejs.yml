name: Ci-nodejs
on:  
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      -  name: Checkout
         uses: actions/checkout@v7.0.1
         with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm test -- --coverage

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

      - name: Discord Success Main Push
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":"✅ Main branch build successful"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Success PR
        if: success() && github.event_name == 'pull_request'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":"✅ Pull Request build successful"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Failure Main Push
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":"❌ Main branch build failed"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Failure PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content":"❌ Pull Request build failed"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Comment Pull Request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## CI Result

            ✅ Build completed

            Coverage report generated successfully.
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.head_ref }}



  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

      - name: Security Audit
        run: npm audit
