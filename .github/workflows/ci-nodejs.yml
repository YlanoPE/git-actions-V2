name: Ci-nodejs
on:  
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      -  name: Checkout
         uses: action/checkout@v7.0.1
         with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      -  name: Instalation Node.js
         run: sudo apt update && sudo apt install node.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm test -- --coverage

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
    
